<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title description">
  <title id="title">Toned AI Humanizer — your voice, with more clarity</title>
  <desc id="description">An evergreen and cream editorial banner with a marked-up document illustration. Rewrite thoughtfully. Review every change.</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183f35"/><stop offset="1" stop-color="#102b25"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M 44 0 L 0 0 0 44" fill="none" stroke="#f5f1e8" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1440" height="440" rx="24" fill="url(#forest)"/>
  <rect width="1440" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="1390" cy="16" r="310" fill="#f5f1e8" opacity=".025"/>
  <circle cx="1390" cy="16" r="236" fill="none" stroke="#cdbb92" stroke-opacity=".15"/>
  <g transform="translate(72 62)">
