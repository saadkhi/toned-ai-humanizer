    <text x="-2" y="226" fill="#f7f3ea" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="-1.6">with more clarity.</text>
    <text x="0" y="278" fill="#c6d3c8" font-family="Arial, Helvetica, sans-serif" font-size="18">Rewrite thoughtfully. Review every change.</text>
    <path d="M0 312h56" stroke="#c78d61" stroke-width="2"/>
    <text x="72" y="317" fill="#c6d3c8" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">THE FINAL SAY STAYS WITH YOU</text>
