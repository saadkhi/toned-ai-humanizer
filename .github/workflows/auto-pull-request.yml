name: Open pull request on push

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# Existing branches are used directly; the workflow never writes commits.
permissions:
  contents: read
  pull-requests: write

# Serialize runs for a branch so simultaneous pushes cannot create duplicate PRs.
concurrency:
  group: auto-pull-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pull-request:
    if: >-
      github.ref_type == 'branch' &&
      !github.event.deleted &&
      github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pull-request-url: ${{ steps.open-pr.outputs.pull-request-url }}
    steps:
      # No checkout or source-code execution is needed to open a PR.
      - name: Find or create the pull request
        id: open-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const base = context.payload.repository.default_branch;
            const head = context.ref.slice('refs/heads/'.length);

            const findExisting = async () => {
              const { data } = await github.rest.pulls.list({
                owner, repo, state: 'open', base,
                head: `${owner}:${head}`, per_page: 1,
              });
              return data[0];
            };

            const report = async (pr, created) => {
              core.setOutput('pull-request-url', pr.html_url);
              core.setOutput('pull-request-number', pr.number);
              const message = created
                ? 'Created a pull request for this branch.'
                : 'An open pull request already exists; pushed commits update it automatically.';
              core.info(`${message} ${pr.html_url}`);
              await core.summary
                .addHeading('Automatic pull request')
                .addRaw(`${message}\n\n`)
                .addLink('View pull request', pr.html_url)
                .write();
            };

            const existing = await findExisting();
            if (existing) {
              await report(existing, false);
              return;
            }

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${head}`,
            });
            if (comparison.ahead_by === 0 || comparison.files?.length === 0) {
              core.info('No new code changes compared with the default branch; skipping PR creation.');
              return;
            }

            // Branch names are API data, never interpolated into shell commands.
            const sourceLabel = head.replace(/`/g, '\\`');
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner, repo, base, head,
                title: `Auto PR: ${head}`.slice(0, 240),
                body: [
                  `Opened automatically after a push to \`${sourceLabel}\`.`,
                  '',
                  'Further pushes to the source branch update this pull request automatically.',
                  '',
                  'Please review the changes and check the Application checks workflow before merging.',
                ].join('\n'),
              });
              await report(pr, true);
            } catch (error) {
              // A contributor may have opened a PR between the list and create requests.
              if (error.status === 422) {
                const raced = await findExisting();
                if (raced) {
                  await report(raced, false);
                  return;
                }
              }
              if (error.status === 403) {
                core.setFailed('GitHub denied PR creation. Enable "Allow GitHub Actions to create and approve pull requests" under Settings > Actions > General > Workflow permissions, and check repository or organization policy.');
                return;
              }
              throw error;
            }
